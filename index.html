<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Registrar</title>
    <style>
        body {
            background-image: url(fondo.jpg);
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    
        .wrapper {
            position: relative;
            top: 5vh;
            width: 50%; /* Cambia la anchura para que sea relativa */
            max-width: 350px; /* Limita la anchura máxima en pantallas más grandes */
            margin: 0 auto;
            border: 1px solid rgb(241, 241, 241);
            border-radius: 12px;
            padding: 10px 20px;
            background: transparent;
            backdrop-filter: blur(8px);
            box-shadow: 10px 10px 15px 0 rgba(0, 0, 0, 0.5);
            color: #fff;
        }
    
        .wrapper h1 {
            font-size: 3vw; /* Escala con el ancho de la pantalla */
            color: #fffefe;
            text-align: center; /* Alineación central en pantallas pequeñas */
        }
    
        .input-field input[type="text"],
        .input-field input[type="password"] {
            border-radius: 10px;
            background: transparent;
            margin: 15px 0;
            border: 2px solid rgb(255, 255, 255);
            width: 90%; /* Asegura que ocupe el 100% del contenedor */
            padding: 15px;
            backdrop-filter: blur(15px);
        }
    
        .input-field i {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            right: 10px;
            color: rgb(252, 252, 252);
        }
    
        input::placeholder {
            color: rgb(255, 255, 255);
        }
    
        a.forgot, a.loginButton {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.712);
            display: block;
            text-align: center; /* Centra el texto en pantallas pequeñas */
        }
    
        a.forgot:hover, a.loginButton:hover {
            text-decoration: underline;
            color: #fffffffd;
        }
    
        .wrapper .registrar {
            background: #ffffff;
            border: none;
            outline: none;
            cursor: pointer;
            font-weight: 600;
            border-radius: 45px;
            width: 80%; /* Relativo al tamaño del contenedor */
            max-width: 200px; /* Limita el tamaño máximo */
            height: 40px; 
            color: #000000;
            display: block; 
            margin: 20px auto;
        }
        /* From Uiverse.io by Navarog21 */ 
        button {
            width: 10em;
            position: relative;
            height: 3.5em;
            border: 3px ridge #00C4FF;
            outline: none;
            background-color: transparent;
            color: white;
            transition: 1s;
            border-radius: 0.3em;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button::after {
            content: "";
            position: absolute;
            top: -10px;
            left: 3%;
            width: 95%;
            height: 40%;
            transition: 0.5s;
            transform-origin: center;
        }

        button::before {
            content: "";
            transform-origin: center;
            position: absolute;
            top: 80%;
            left: 3%;
            width: 95%;
            height: 40%;
            transition: 0.5s;
        }

        button:hover::before, button:hover::after {
            transform: scale(0)
        }

        button:hover {
            box-shadow: inset 0px 0px 25px #00C4FF;
        }
    
        @media (max-width: 400) {
            .wrapper h2 {
                font-size: 20px; 
            }
    
            .input-field input[type="text"],
            .input-field input[type="password"] {
                padding: 10px 15px; 
            }
            
            .wrapper .registrar {
                width: 100%; /* Ocupa todo el ancho disponible en pantallas pequeñas */
            }
        }
        /* From Uiverse.io by csozidev */ 
        /* Spotify music card made by: csozi | Website: www.csozi.hu*/

        .card {
            position: relative;
            width: 250px;
            height: 120px;
            background: #191414;
            border-radius: 10px;
            padding: 10px;
        }

        .top {
            position: relative;
            width: 100%;
            display: flex;
            gap: 10px;
        }

        .pfp {
            position: relative;
            top: 5px;
            left: 5px;
            height: 40px;
            width: 40px;
            background-color: #d2d2d2;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .title-1 {
            color: white;
            font-size: 25px;
            font-weight: bolder;
            position: absolute; /* O también puede ser relative, fixed, sticky dependiendo de tus necesidades */
            top: -17px; /* Mueve el elemento 50 píxeles hacia abajo desde la parte superior */
            left: 60px;
        }

        .title-2 {
            color: white;
            font-size: 12px;
            font-weight: normal;
            position: absolute; /* O también puede ser relative, fixed, sticky dependiendo de tus necesidades */
            top: 50px; /* Mueve el elemento 50 píxeles hacia abajo desde la parte superior */
            left: 10px; /* Mueve el elemento 100 píxeles hacia la derecha desde la parte izquierda */
        }


        .time {
            width: 90%;
            background-color: #5e5e5e;
            height: 6px;
            border-radius: 3px;
            position: absolute;
            left: 5%;
            bottom: 22px;
        }

        .elapsed {
            width: 42%;
            background-color: #1db954;
            height: 100%;
            border-radius: 3px;
        }

        .controls {
            color: white;
            display: flex;
            position: absolute;
            bottom: 30px; /*posicion de los botones*/
            left: 0;
            width: 100%;
            justify-content: center;
        }

        .volume {
            height: 100%;
            width: 48px;
        }

        .air {
            height: 100%;
            width: 48px;
        }

        .controls svg {
            cursor: pointer;
            transition: 0.1s;
        }

        .controls svg:hover {
            color: #1db954;
        }

        .volume {
            opacity: 0;
            position: relative;
            transition: 0.2s;
        }

        .volume .slider {
            height: 4px;
            background-color: #5e5e5e;
            width: 80%;
            border-radius: 2px;
            margin-top: 8px;
            margin-left: 10%;
        }

        .volume .slider .green {
            background-color: #1db954;
            height: 100%;
            width: 80%;
            border-radius: 3px;
        }

        .volume .circle {
            background-color: white;
            height: 6px;
            width: 6px;
            border-radius: 3px;
            position: absolute;
            right: 20%;
            top: 60%;
        }

        .volume_button:hover ~ .volume {
            opacity: 1;
        }

        .timetext {
            color: white;
            font-size: 8px;
            position: absolute;
        }

        .time_now {
            bottom: 11px;
            left: 10px;
        }

        .time_full {
            bottom: 11px;
            right: 10px;
        }

        .playing {
            display: flex;
            position: relative;
            justify-content: center;
            gap: 1px;
            width: 30px;
            height: 20px;
        }

        .greenline {
            background-color: #1db954;
            height: 20px;
            width: 2px;
            position: relative;
            transform-origin: bottom;
        }

        .line-1 {
            animation: infinite playing 1s ease-in-out;
            animation-delay: 0.2s;
        }

        .line-2 {
            animation: infinite playing 1s ease-in-out;
            animation-delay: 0.5s;
        }

        .line-3 {
            animation: infinite playing 1s ease-in-out;
            animation-delay: 0.6s;
        }

        .line-4 {
            animation: infinite playing 1s ease-in-out;
            animation-delay: 0s;
        }

        .line-5 {
            animation: infinite playing 1s ease-in-out;
            animation-delay: 0.4s;
        }

        @keyframes playing {
        0% {
            transform: scaleY(0.1);
        }

        33% {
            transform: scaleY(0.6);
        }

        66% {
            transform: scaleY(0.9);
        }

        100% {
            transform: scaleY(0.1);
        }
        }
    </style>
    
</head>

     <a href="#" id="audioLink" style="color: white">Haz clic para reproducir el audio</a>
    <audio id="audioPlayer" src="Labios de Cereza 2.mp3"></audio>
    
    <script>
        const audioLink = document.getElementById('audioLink');
        const audioPlayer = document.getElementById('audioPlayer');

        audioLink.addEventListener('click', (event) => {
            event.preventDefault(); 
            audioPlayer.play(); 
        });

        var audio = document.getElementById("audioPlayer");

        // Verificar si hay un tiempo guardado y reproducir desde ese punto
        if (localStorage.getItem("audioTime")) {
            audio.currentTime = localStorage.getItem("audioTime");
        }

        // Reanudar audio si estaba en reproducción
        if (localStorage.getItem("audioPlaying") === "true") {
            audio.play();
        }

        // Guardar la posición del audio cada segundo
        audio.addEventListener('timeupdate', function () {
            localStorage.setItem("audioTime", audio.currentTime);
        });

        // Guardar el estado cuando se pausa
        audio.addEventListener('pause', function () {
            localStorage.setItem("audioPlaying", "false");
        });

        // Guardar el estado cuando se reproduce
        audio.addEventListener('play', function () {
            localStorage.setItem("audioPlaying", "true");
        });

    </script>
